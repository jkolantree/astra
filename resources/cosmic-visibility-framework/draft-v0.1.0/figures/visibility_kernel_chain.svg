<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Visibility kernel: source to certificate</title>
  <desc id="desc">A layered flow diagram showing source production, transduction, propagation, archive or sampling, observation, and a conditional certificate. A lower lane shows calibration channels feeding the visibility field.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf3f7"/>
    </linearGradient>
    <linearGradient id="source" x1="0" x2="1">
      <stop offset="0" stop-color="#183b56"/>
      <stop offset="1" stop-color="#23658a"/>
    </linearGradient>
    <linearGradient id="visibility" x1="0" x2="1">
      <stop offset="0" stop-color="#f5e6ba"/>
      <stop offset="1" stop-color="#f3d99c"/>
    </linearGradient>
    <linearGradient id="certificate" x1="0" x2="1">
      <stop offset="0" stop-color="#3f3474"/>
      <stop offset="1" stop-color="#6652aa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#102a43" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 29px "SPPT DejaVu Sans", sans-serif; fill: #102a43; }
      .subtitle { font: 400 17px "SPPT DejaVu Sans", sans-serif; fill: #52606d; }
      .label { font: 700 17px "SPPT DejaVu Sans", sans-serif; fill: #102a43; }
      .small { font: 400 14px "SPPT DejaVu Sans", sans-serif; fill: #334e68; }
      .small-light { font: 400 14px "SPPT DejaVu Sans", sans-serif; fill: #f7fbff; }
      .mono { font: 700 14px "SPPT DejaVu Sans Mono", monospace; fill: #334e68; }
      .box { stroke: #9fb3c8; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#paper)"/>
  <text x="70" y="66" class="title">Visibility is a property of the whole chain</text>
  <text x="70" y="98" class="subtitle">A source claim is conditional on production, conversion, propagation, sampling, observation, and certification.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="184" height="148" rx="16" fill="url(#source)" class="box"/>
    <rect x="278" y="150" width="184" height="148" rx="16" fill="#dceef7" class="box"/>
    <rect x="486" y="150" width="184" height="148" rx="16" fill="url(#visibility)" class="box"/>
    <rect x="694" y="150" width="184" height="148" rx="16" fill="#dfeee6" class="box"/>
    <rect x="902" y="150" width="184" height="148" rx="16" fill="#f0e5f8" class="box"/>
    <rect x="1110" y="150" width="220" height="148" rx="16" fill="url(#certificate)" class="box"/>
  </g>

  <g fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)">
    <path d="M254 224 H270"/>
    <path d="M462 224 H478"/>
    <path d="M670 224 H686"/>
    <path d="M878 224 H894"/>
    <path d="M1086 224 H1102"/>
  </g>

  <g text-anchor="middle">
    <text x="162" y="190" class="small-light">01 / SOURCE</text>
    <text x="162" y="224" class="label" fill="#f7fbff">Hidden state</text>
    <text x="162" y="250" class="small-light">r_H(q), history,</text>
    <text x="162" y="272" class="small-light">abundance, labels</text>

    <text x="370" y="190" class="small">02 / PRODUCE</text>
    <text x="370" y="224" class="label">Residue field</text>
    <text x="370" y="250" class="small">decay, melt,</text>
    <text x="370" y="272" class="small">or source process</text>

    <text x="578" y="190" class="small">03 / TRANSDUCE</text>
    <text x="578" y="224" class="label">Carrier conversion</text>
    <text x="578" y="250" class="small">B, coupling,</text>
    <text x="578" y="272" class="small">coherence, support</text>

    <text x="786" y="190" class="small">04 / PROPAGATE</text>
    <text x="786" y="224" class="label">Alter and carry</text>
    <text x="786" y="250" class="small">redshift, plasma,</text>
    <text x="786" y="272" class="small">shock, survival</text>

    <text x="994" y="190" class="small">05 / SAMPLE</text>
    <text x="994" y="224" class="label">Archive or mask</text>
    <text x="994" y="250" class="small">recovery, catalogue,</text>
    <text x="994" y="272" class="small">selection function</text>

    <text x="1220" y="190" class="small-light">06 / CERTIFY</text>
    <text x="1220" y="224" class="label" fill="#f7fbff">Observed record</text>
    <text x="1220" y="250" class="small-light">detector response,</text>
    <text x="1220" y="272" class="small-light">held-out test</text>
  </g>

  <rect x="70" y="360" width="1260" height="125" rx="18" fill="#ffffff" stroke="#d1dbe5" stroke-width="2"/>
  <text x="101" y="397" class="label">Visibility kernel eta(q; psi)</text>
  <text x="101" y="427" class="mono">eta_prod x eta_trans x eta_prop x eta_arch x eta_samp x eta_obs</text>
  <text x="101" y="456" class="small">Every factor has a unit, support, calibration record, and uncertainty - or is explicitly marked unknown.</text>

  <path d="M580 298 V348" fill="none" stroke="#c58a1c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="329" class="small">field calibration</text>

  <g filter="url(#shadow)">
    <rect x="70" y="545" width="360" height="130" rx="16" fill="#e4f3fa" stroke="#8bbfd4" stroke-width="2"/>
    <rect x="520" y="545" width="360" height="130" rx="16" fill="#e9f5ec" stroke="#8bbd99" stroke-width="2"/>
    <rect x="970" y="545" width="360" height="130" rx="16" fill="#f7eddd" stroke="#d1a76b" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="250" y="583" class="label">Independent calibration</text>
    <text x="250" y="611" class="small">FRB DM / RM / lensing / gas /</text>
    <text x="250" y="635" class="small">exposure / isotope controls</text>

    <text x="700" y="583" class="label">Identifiability</text>
    <text x="700" y="611" class="small">exact quotient / epsilon-class /</text>
    <text x="700" y="635" class="small">Fisher rank / graph labels</text>

    <text x="1150" y="583" class="label">Decision boundary</text>
    <text x="1150" y="611" class="small">pre-registered intervention /</text>
    <text x="1150" y="635" class="small">calibrated held-out prediction</text>
  </g>
  <path d="M430 610 H512 M880 610 H962" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="70" y="728" class="small">Original vector artwork. A certificate is conditional on the complete, quantified chain.</text>
</svg>
