   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008477" x="51.45984" y="119.61792" transform="rotate(-0 51.45984 119.61792)">ENCELADUS</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008477" x="66.3984" y="161.379784" transform="rotate(-0 66.3984 161.379784)">Formation history</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(66.3984 185.438437)">Recipe + cooling</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(66.3984 199.295703)">Phase + microstructure</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008477" x="266.8896" y="161.379784" transform="rotate(-0 266.8896 161.379784)">Daughter configuration</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(266.8896 185.438437)">Fragment sizes + marks</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(266.8896 199.295703)">Elemental balance</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008477" x="467.3808" y="161.379784" transform="rotate(-0 467.3808 161.379784)">Physical survival</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(467.3808 185.438437)">Sublimation / transport</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(467.3808 199.295703)">Exposure + speed</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008477" x="667.872" y="161.379784" transform="rotate(-0 667.872 161.379784)">Instrument record</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(667.872 185.438437)">Trigger + telemetry</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(667.872 199.295703)">Impact response</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006ead" x="51.45984" y="275.89824" transform="rotate(-0 51.45984 275.89824)">LUNAR SURFACE</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006ead" x="66.3984" y="317.660104" transform="rotate(-0 66.3984 317.660104)">Incident population</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(66.3984 341.718757)">Upstream source</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(66.3984 355.576023)">Material + disturbance</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006ead" x="266.8896" y="317.660104" transform="rotate(-0 266.8896 317.660104)">Particle production</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(266.8896 341.718757)">Scattering / sputtering</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(266.8896 355.576023)">Charge conversion</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006ead" x="467.3808" y="317.660104" transform="rotate(-0 467.3808 317.660104)">Physical survival</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(467.3808 341.718757)">Photodetachment</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(467.3808 355.576023)">Angular transport</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006ead" x="667.872" y="317.660104" transform="rotate(-0 667.872 317.660104)">Instrument record</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(667.872 341.718757)">Acceptance + efficiency</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(667.872 355.576023)">Energy / species response</text>
   </g>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008477" x="38.88" y="23.5296" transform="rotate(-0 38.88 23.5296)">06  /  SCIENTIFIC ATLAS</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d40" x="38.88" y="47.6064" transform="rotate(-0 38.88 47.6064)">Formation is only the start of a detected sample</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #516677" x="38.88" y="71.6832" transform="rotate(-0 38.88 71.6832)">Enceladus grains and lunar ions share an inference discipline, with different physics at every stage.</text>
  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008477" x="52.704" y="430.6464" transform="rotate(-0 52.704 430.6464)">Control the Enceladus comparison</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(52.704 446.672491)">Measure chemistry and phase before and after drying.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(52.704 461.2896)">Compare the same grain, or a declared matched population.</text>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006ead" x="453.6" y="430.6464" transform="rotate(-0 453.6 430.6464)">Control the lunar comparison</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(453.6 446.672491)">Separate ionization probability from detector calibration.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(453.6 461.2896)">Retain source exposure, angular support and non-detections.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #516677" transform="translate(38.88 512.088523)">Proposed experimental / inference design, not a Cassini or lunar reconstruction. Physical loss precedes detector selection.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #516677" transform="translate(38.88 523.544266)">Sources: report Sections 6 and C4-C6; Postberg et al. (2026), EPSC2026-1326, and the Chang’e-6 studies (2025-2026).</text>
  </g>
 </g>
