      <tspan x="37.117285" y="-0.0625" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">/</tspan>
      <tspan x="41.497168" y="-0.0625" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">|</tspan>
