      <tspan x="11.314453" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">=</tspan>
      <tspan x="23.707031" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">(</tspan>
      <tspan x="28.388672" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">0</tspan>
      <tspan x="36.023438" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">,</tspan>
      <tspan x="44.513672" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">−</tspan>
      <tspan x="56.90625" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">c</tspan>
      <tspan x="63.503906" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">o</tspan>
      <tspan x="70.845703" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">s</tspan>
      <tspan x="93.096719" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">,</tspan>
      <tspan x="101.586953" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">−</tspan>
      <tspan x="113.979531" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">s</tspan>
      <tspan x="120.231484" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">i</tspan>
      <tspan x="123.565469" y="-0.875" style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #142d40">n</tspan>
