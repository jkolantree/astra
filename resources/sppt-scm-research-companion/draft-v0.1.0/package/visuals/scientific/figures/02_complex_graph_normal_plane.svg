      <tspan x="7.477539" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">(</tspan>
      <tspan x="20.242676" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">)</tspan>
      <tspan x="27.847168" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">=</tspan>
      <tspan x="41.272461" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">(</tspan>
