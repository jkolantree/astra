     </text>
    </g>
   </g>
   <g id="text_9">
    <!-- $T=F_x/|F_x|,\quad B=T\times N$ -->
    <g style="fill: #142d40" transform="translate(561.6 207.3888)">
     <text>
      <tspan x="0" y="-0.0625" style="font-style: oblique; font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">T</tspan>
