    </g>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(561.6 274.464534)">N and B span the plane</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(561.6 290.12544)">perpendicular to the tangent T.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(561.6 317.408748)">The fixed-x plane instead holds</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(561.6 333.069654)">the complex graph height</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #142d40" transform="translate(561.6 348.73056)">U = a(Re ψ, Im ψ).</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #b65a13" transform="translate(561.6 411.471082)">Finite slope requires a tangential</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #b65a13" transform="translate(561.6 426.29616)">reparametrization in graph flow.</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008477" x="38.88" y="23.5296" transform="rotate(-0 38.88 23.5296)">02  /  SCIENTIFIC ATLAS</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d40" x="38.88" y="47.6064" transform="rotate(-0 38.88 47.6064)">A complex graph and its normal plane</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #516677" x="38.88" y="71.6832" transform="rotate(-0 38.88 71.6832)">The two transverse graph coordinates and the geometric normal frame are distinct constructions.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #516677" transform="translate(38.88 512.088523)">Analytic geometry, not a time-evolved PDE solution or a model of matter. A = 0.6 L₀, k = 1/L₀; arbitrary length L₀.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #516677" transform="translate(38.88 523.544266)">The normal frame does not establish spin, charge or a gravitational metric. Sources: report Section 3; Hasimoto (1972).</text>
  </g>
 </g>
