      <tspan x="108.802044" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">,</tspan>
      <tspan x="124.36015" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">s</tspan>
      <tspan x="131.133099" y="-0.125" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">i</tspan>
