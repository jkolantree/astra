      <tspan x="63.475293" y="-0.0625" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">,</tspan>
      <tspan x="94.255078" y="-0.0625" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">=</tspan>
      <tspan x="118.154004" y="-0.0625" style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #142d40">×</tspan>
      <tspan x="31.376465" y="2.070312" style="font-style: oblique; font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #142d40">x</tspan>
