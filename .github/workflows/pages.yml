name: Publish accessible reading room

# Manual by design: stable paths are assembled from annotated, immutable releases.
# A descendant main commit is admitted only when its post-release changes stay in
# the explicit communications allowlist below. The repository's Pages source is
# GitHub Actions; this workflow remains manual so deployment follows release lock.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build release-bound reading room
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          site="$RUNNER_TEMP/astra-pages"
          downloads="$RUNNER_TEMP/astra-pages-downloads"
          rm -rf -- "$site" "$downloads"
          mkdir -p -- "$site" "$downloads"
          cp -R -- docs/. "$site/"

          current_version="$(jq -er '.version | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))' RELEASE_SPEC.json)"
          current_tag="v${current_version}"
          current_ref="refs/tags/${current_tag}"
          test "$(git cat-file -t "$current_ref")" = tag
          current_commit="$(git rev-parse "${current_ref}^{commit}")"
          git merge-base --is-ancestor "$current_commit" HEAD
          git show "${current_ref}^{commit}:RELEASE_SPEC.json" > "$downloads/TAG_RELEASE_SPEC.json"
          cmp --silent -- RELEASE_SPEC.json "$downloads/TAG_RELEASE_SPEC.json"

          current_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${current_tag}")"
          jq -e '
            .tag_name == $tag and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' --arg tag "$current_tag" <<<"$current_release" >/dev/null

          latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
          test "$(jq -er '.id' <<<"$latest_release")" = "$(jq -er '.id' <<<"$current_release")"
          jq -e '
            .tag_name == $tag and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' --arg tag "$current_tag" <<<"$latest_release" >/dev/null

          paper_version="v0.1"
          paper_tag="earth-instrument-wp-0.1"
          paper_ref="refs/tags/${paper_tag}"
          paper_path="resources/earth-is-the-instrument/${paper_version}"
          paper_pdf="ASTRA_Earth_Is_the_Instrument_Working_Paper_v0.1.pdf"
          paper_assets=("$paper_pdf" "FONT_NOTICES.txt" "SHA256SUMS.txt" "cover.png")
          paper_payloads=("$paper_pdf" "FONT_NOTICES.txt" "cover.png")

          framework_version="v0.3.0"
          framework_tag="earth-instrument-framework-v0.3.0"
          framework_ref="refs/tags/${framework_tag}"
          framework_path="resources/earth-is-the-instrument/${framework_version}"
          framework_main="ASTRA_Framework_v0.3.0_Earth_Is_The_Instrument.pdf"
          framework_ground="ASTRA_v0.3.0_Public_Ground_Reading.pdf"
          framework_audit="ASTRA_Dual_Rent_Local_to_Global_Audit_Form_v0.3.0.pdf"
          framework_report="ASTRA_v0.3.0_Verification_Report.pdf"
          framework_archive="ASTRA_Framework_v0.3.0_Dual_Rent_Arithmetic_Seams.zip"
          framework_assets=(
            "$framework_main"
            "$framework_ground"
            "$framework_audit"
            "$framework_report"
            "$framework_archive"
            "${framework_archive}.sha256"
            "${framework_archive}.verify.txt"
            "FONT_NOTICES.txt"
            "PUBLICATION_AUDIT.md"
            "SHA256SUMS.txt"
            "cover.png"
          )
          framework_payloads=(
            "$framework_main"
            "$framework_ground"
            "$framework_audit"
            "$framework_report"
            "$framework_archive"
            "${framework_archive}.sha256"
            "${framework_archive}.verify.txt"
            "FONT_NOTICES.txt"
            "PUBLICATION_AUDIT.md"
            "cover.png"
          )
          framework_pages_payloads=(
            "$framework_main"
            "$framework_ground"
            "$framework_audit"
            "$framework_report"
            "FONT_NOTICES.txt"
            "PUBLICATION_AUDIT.md"
            "SHA256SUMS.txt"
            "cover.png"
          )

          test "$(git cat-file -t "$paper_ref")" = tag
          paper_commit="$(git rev-parse "${paper_ref}^{commit}")"
          git merge-base --is-ancestor "$paper_commit" HEAD

          test "$(git cat-file -t "$framework_ref")" = tag
          framework_commit="$(git rev-parse "${framework_ref}^{commit}")"
          git merge-base --is-ancestor "$framework_commit" HEAD

          if test "$(git rev-parse HEAD)" != "$framework_commit"; then
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/ISSUE_TEMPLATE/accessibility.yml|.github/ISSUE_TEMPLATE/config.yml|.github/ISSUE_TEMPLATE/reproducibility.yml|.github/ISSUE_TEMPLATE/scientific-correction.yml|.github/workflows/pages.yml|CHANGELOG.md|LICENSE_MAP.md|MANIFEST.sha256|README.md|RELEASE_NOTES_earth-instrument-framework-v0.3.0.md|RELEASE_NOTES_earth-instrument-wp-0.1.md|THIRD_PARTY_NOTICES.md|docs/404.html|docs/index.html|docs/style.css|docs/resources/index.html|docs/resources/earth-is-the-instrument/v0.1/index.html|docs/resources/earth-is-the-instrument/v0.3.0/audit-form/index.html|docs/resources/earth-is-the-instrument/v0.3.0/errata/index.html|docs/resources/earth-is-the-instrument/v0.3.0/ground-reading/index.html|docs/resources/earth-is-the-instrument/v0.3.0/index.html|evidence/README.md|resources/README.md|resources/earth-is-the-instrument/v0.1/README.md|resources/earth-is-the-instrument/v0.3.0/ERRATA.md|resources/earth-is-the-instrument/v0.3.0/README.md|schemas/README.md|tests/test_pages_contract.py|tests/test_resource_contract.py|tools/check_repository.py) ;;
                *)
                  echo "Unreleased non-communications change cannot enter Pages: $changed_path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only "${framework_ref}^{commit}" HEAD)
          fi

          paper_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${paper_tag}")"
          paper_asset_json="$(jq -cn --args '$ARGS.positional | sort' "${paper_assets[@]}")"
          jq -e '
            .tag_name == $tag and
            .draft == false and
            .prerelease == true and
            .immutable == true and
            (.assets | map(.name) | sort) == $assets
          ' --arg tag "$paper_tag" --argjson assets "$paper_asset_json" \
            <<<"$paper_release" >/dev/null

          framework_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${framework_tag}")"
          framework_asset_json="$(jq -cn --args '$ARGS.positional | sort' "${framework_assets[@]}")"
          jq -e '
            .tag_name == $tag and
            .draft == false and
            .prerelease == true and
            .immutable == true and
            (.assets | map(.name) | sort) == $assets
          ' --arg tag "$framework_tag" --argjson assets "$framework_asset_json" \
            <<<"$framework_release" >/dev/null

          mapfile -t release_tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false and .immutable == true) | .tag_name' |
              grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' |
              sort -V
          )
          test "${#release_tags[@]}" -gt 0
          printf '%s\n' "${release_tags[@]}" | grep -Fx -- "$current_tag" >/dev/null

          mkdir -p -- "$site/editions" "$site/schemas"

          for tag in "${release_tags[@]}"; do
            version="${tag#v}"
            preprint="SPPT_ASTRA_preprint_${tag}.html"
            supplement="SPPT_ASTRA_technical_supplement_${tag}.html"
            source_archive="SPPT_ASTRA_${tag}_source.tar.gz"
            release_dir="$downloads/$tag"
            extract_dir="$release_dir/source"
            archive_root="SPPT_ASTRA_${tag}"
            version_dir="$site/$tag"

            mkdir -p -- "$release_dir" "$extract_dir" "$version_dir/preprint" "$version_dir/supplement"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$release_dir" \
              --pattern "$preprint" \
              --pattern "$supplement" \
              --pattern "$source_archive" \
              --pattern SHA256SUMS

            for asset in "$preprint" "$supplement" "$source_archive" SHA256SUMS; do
              test -f "$release_dir/$asset"
            done
            for asset in "$preprint" "$supplement" "$source_archive"; do
              test "$(awk -v name="$asset" '$2 == name { count += 1 } END { print count + 0 }' "$release_dir/SHA256SUMS")" -eq 1
            done

            awk -v preprint="$preprint" -v supplement="$supplement" -v source="$source_archive" '
              $2 == preprint || $2 == supplement || $2 == source { print }
            ' "$release_dir/SHA256SUMS" > "$release_dir/PAGES_SHA256SUMS"
            test "$(wc -l < "$release_dir/PAGES_SHA256SUMS")" -eq 3
            (
              cd "$release_dir"
              sha256sum --check --strict PAGES_SHA256SUMS
            )

            while IFS= read -r member; do
              case "$member" in
                "$archive_root"|"$archive_root/"*) ;;
                *) echo "Unsafe source-archive member: $member" >&2; exit 1 ;;
              esac
              case "/$member/" in
                *"/../"*) echo "Unsafe source-archive traversal: $member" >&2; exit 1 ;;
              esac
            done < <(tar -tzf "$release_dir/$source_archive")
            if tar -tvzf "$release_dir/$source_archive" | grep -E '^[lh]' >/dev/null; then
              echo "Source archive contains a link" >&2
              exit 1
            fi
            tar -xzf "$release_dir/$source_archive" -C "$extract_dir"
            source_root="$extract_dir/$archive_root"
            test -f "$source_root/RELEASE_SPEC.json"
            jq -e '.version == $version and .tag == $tag' \
              --arg version "$version" --arg tag "$tag" \
              "$source_root/RELEASE_SPEC.json" >/dev/null

            cp -- "$release_dir/$preprint" "$version_dir/preprint/index.html"
            cp -- "$release_dir/$supplement" "$version_dir/supplement/index.html"
            if test -d "$source_root/data"; then
              cp -R -- "$source_root/data" "$version_dir/data"
            fi
            if test -d "$source_root/schemas"; then
              cp -R -- "$source_root/schemas" "$version_dir/schemas"
              while IFS= read -r -d '' schema; do
                relative="${schema#"$source_root/schemas/"}"
                if [[ ! "$relative" =~ ^[a-z0-9][a-z0-9._/-]*[.]schema[.]json$ ]] || [[ "/$relative/" == *"/../"* ]]; then
                  echo "Unsafe schema path: $relative" >&2
                  exit 1
                fi
                target="$site/schemas/$relative"
                mkdir -p -- "$(dirname "$target")"
                if test -f "$target"; then
                  cmp --silent -- "$schema" "$target" || {
                    echo "Immutable schema revision changed: $relative" >&2
                    exit 1
                  }
                else
                  cp -- "$schema" "$target"
                fi
              done < <(find "$source_root/schemas" -type f -name '*.schema.json' -print0)
              cat > "$version_dir/schemas/index.html" <<HTML
          <!doctype html>
          <html lang="en-US">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>JSON schemas for SPPT/ASTRA ${tag}</title>
            <link rel="stylesheet" href="../../style.css">
          </head>
          <body>
            <a class="skip-link" href="#main-content">Skip to main content</a>
            <header><div class="wrap"><p class="eyebrow">SPPT/ASTRA ${tag}</p><h1>JSON schemas</h1></div></header>
            <main id="main-content" class="wrap">
              <p><a href="../">Edition home</a></p>
              <ul>
          HTML
              while IFS= read -r schema; do
                name="$(basename "$schema")"
                printf '      <li><a href="./%s">%s</a></li>\n' "$name" "$name" >> "$version_dir/schemas/index.html"
              done < <(find "$source_root/schemas" -maxdepth 1 -type f -name '*.schema.json' | sort)
              cat >> "$version_dir/schemas/index.html" <<'HTML'
              </ul>
            </main>
          </body>
          </html>
          HTML
            fi

            cat > "$version_dir/index.html" <<HTML
          <!doctype html>
          <html lang="en-US">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SPPT/ASTRA ${tag} | Accessible reading room</title>
            <link rel="stylesheet" href="../style.css">
          </head>
          <body>
            <a class="skip-link" href="#main-content">Skip to main content</a>
            <header><div class="wrap"><p class="eyebrow">Versioned edition</p><h1>SPPT/ASTRA ${tag}</h1></div></header>
            <main id="main-content" class="wrap">
              <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../">Reading-room home</a> <span aria-hidden="true">/</span> <a href="../editions/">Reference editions</a> <span aria-hidden="true">/</span> <span aria-current="page">${tag}</span></nav>
              <aside class="notice" aria-labelledby="status-${version}">
                <h2 id="status-${version}">Scientific status</h2>
                <p>This is a not-peer-reviewed perspective and mathematical framework with reduced synthetic demonstrations. It is not empirical planetary validation.</p>
              </aside>
              <h2>Read this edition</h2>
              <ul class="cards">
                <li><a href="./preprint/">Preprint <span aria-hidden="true">&rarr;</span></a></li>
                <li><a href="./supplement/">Technical supplement <span aria-hidden="true">&rarr;</span></a></li>
              </ul>
              <p><a href="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}">Download the immutable release assets and checksums</a>.</p>
            </main>
          </body>
          </html>
          HTML
          done

          paper_release_dir="$downloads/$paper_tag"
          paper_target_dir="$site/$paper_path"
          mkdir -p -- "$paper_release_dir" "$paper_target_dir"
          gh release download "$paper_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$paper_release_dir" \
            --pattern "$paper_pdf" \
            --pattern FONT_NOTICES.txt \
            --pattern SHA256SUMS.txt \
            --pattern cover.png

          for asset in "${paper_assets[@]}"; do
            test -f "$paper_release_dir/$asset"
            api_digest="$(jq -er '
              .assets[] |
              select(.name == $name) |
              .digest |
              select(test("^sha256:[0-9a-f]{64}$"))
            ' --arg name "$asset" <<<"$paper_release")"
            actual_digest="sha256:$(sha256sum "$paper_release_dir/$asset" | awk '{print $1}')"
            test "$actual_digest" = "$api_digest"
          done

          git show "${paper_ref}^{commit}:${paper_path}/SHA256SUMS.txt" \
            > "$paper_release_dir/TAG_SHA256SUMS.txt"
          cmp --silent -- \
            "$paper_release_dir/SHA256SUMS.txt" \
            "$paper_release_dir/TAG_SHA256SUMS.txt"
          test "$(wc -l < "$paper_release_dir/SHA256SUMS.txt")" -eq 3
          awk '
            NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 }
          ' "$paper_release_dir/SHA256SUMS.txt"
          diff -u \
            <(printf '%s\n' "${paper_payloads[@]}" | sort) \
            <(awk '{print $2}' "$paper_release_dir/SHA256SUMS.txt" | sort)
          (
            cd "$paper_release_dir"
            sha256sum --check --strict SHA256SUMS.txt
          )
          for asset in "${paper_assets[@]}"; do
            cp -- "$paper_release_dir/$asset" "$paper_target_dir/$asset"
          done

          framework_release_dir="$downloads/$framework_tag"
          framework_target_dir="$site/$framework_path"
          mkdir -p -- "$framework_release_dir" "$framework_target_dir"
          framework_download_args=()
          for asset in "${framework_assets[@]}"; do
            framework_download_args+=(--pattern "$asset")
          done
          gh release download "$framework_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$framework_release_dir" \
            "${framework_download_args[@]}"

          for asset in "${framework_assets[@]}"; do
            test -f "$framework_release_dir/$asset"
            api_digest="$(jq -er '
              .assets[] |
              select(.name == $name) |
              .digest |
              select(test("^sha256:[0-9a-f]{64}$"))
            ' --arg name "$asset" <<<"$framework_release")"
            actual_digest="sha256:$(sha256sum "$framework_release_dir/$asset" | awk '{print $1}')"
            test "$actual_digest" = "$api_digest"
          done

          git show "${framework_ref}^{commit}:${framework_path}/SHA256SUMS.txt" \
            > "$framework_release_dir/TAG_SHA256SUMS.txt"
          cmp --silent -- \
            "$framework_release_dir/SHA256SUMS.txt" \
            "$framework_release_dir/TAG_SHA256SUMS.txt"
          test "$(wc -l < "$framework_release_dir/SHA256SUMS.txt")" -eq 10
          awk '
            NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 }
          ' "$framework_release_dir/SHA256SUMS.txt"
          diff -u \
            <(printf '%s\n' "${framework_payloads[@]}" | sort) \
            <(awk '{print $2}' "$framework_release_dir/SHA256SUMS.txt" | sort)
          (
            cd "$framework_release_dir"
            sha256sum --check --strict SHA256SUMS.txt
            test "$(wc -l < "${framework_archive}.sha256")" -eq 1
            awk -v archive="$framework_archive" '
              NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != archive { exit 1 }
            ' "${framework_archive}.sha256"
            sha256sum --check --strict "${framework_archive}.sha256"
            archive_digest="$(sha256sum "$framework_archive" | awk '{print $1}')"
            grep -Fx -- "archive_sha256: $archive_digest" "${framework_archive}.verify.txt"
            grep -Fx -- "verification_status: PASS" "${framework_archive}.verify.txt"
          )
          for asset in "${framework_pages_payloads[@]}"; do
            cp -- "$framework_release_dir/$asset" "$framework_target_dir/$asset"
          done
          test -f "$framework_path/ERRATA.md"
          cp -- "$framework_path/ERRATA.md" "$framework_target_dir/ERRATA.md"

          framework_pages_roster=(
            "$framework_main"
            "$framework_ground"
            "$framework_audit"
            "$framework_report"
            "ERRATA.md"
            "FONT_NOTICES.txt"
            "PUBLICATION_AUDIT.md"
            "SHA256SUMS.txt"
            "audit-form/index.html"
            "companion.css"
            "cover.png"
            "errata/index.html"
            "ground-reading/index.html"
            "index.html"
          )
          diff -u \
            <(printf '%s\n' "${framework_pages_roster[@]}" | sort) \
            <(find "$framework_target_dir" -type f -printf '%P\n' | sort)

          cat > "$site/editions/index.html" <<'HTML'
          <!doctype html>
          <html lang="en-US">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SPPT/ASTRA reference editions</title>
            <link rel="stylesheet" href="../style.css">
          </head>
          <body>
            <a class="skip-link" href="#main-content">Skip to main content</a>
            <header><div class="wrap"><p class="eyebrow">SPPT/ASTRA</p><h1>Reference editions</h1></div></header>
            <main id="main-content" class="wrap">
              <p><a href="../">Reading-room home</a></p>
              <p>These are the core SPPT/ASTRA reference editions. Each link is rebuilt from checksum-verified assets of an immutable, non-prerelease GitHub Release. Separately versioned working papers are listed in the <a href="../resources/">supplemental-resource index</a>.</p>
              <h2>Current reference edition</h2>
              <ul>
          HTML
          printf '      <li><a href="../%s/">SPPT/ASTRA %s</a> — GitHub Latest</li>\n' "$current_tag" "$current_tag" >> "$site/editions/index.html"
          cat >> "$site/editions/index.html" <<'HTML'
              </ul>
              <h2>Earlier immutable reference editions</h2>
              <ul>
          HTML
          for ((index=${#release_tags[@]} - 1; index >= 0; index--)); do
            tag="${release_tags[$index]}"
            if test "$tag" != "$current_tag"; then
              printf '      <li><a href="../%s/">SPPT/ASTRA %s</a></li>\n' "$tag" "$tag" >> "$site/editions/index.html"
            fi
          done
          cat >> "$site/editions/index.html" <<'HTML'
              </ul>
            </main>
          </body>
          </html>
          HTML

          cat > "$site/schemas/index.html" <<'HTML'
          <!doctype html>
          <html lang="en-US">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Published JSON schemas | SPPT/ASTRA</title>
            <link rel="stylesheet" href="../style.css">
          </head>
          <body>
            <a class="skip-link" href="#main-content">Skip to main content</a>
            <header><div class="wrap"><p class="eyebrow">SPPT/ASTRA</p><h1>Published JSON schemas</h1></div></header>
            <main id="main-content" class="wrap">
              <p><a href="../">Reading-room home</a></p>
              <p>A schema revision keeps the same public URL only while its bytes remain identical across releases.</p>
              <ul>
          HTML
          while IFS= read -r schema; do
            name="$(basename "$schema")"
            printf '      <li><a href="./%s">%s</a></li>\n' "$name" "$name" >> "$site/schemas/index.html"
          done < <(find "$site/schemas" -maxdepth 1 -type f -name '*.schema.json' | sort)
          cat >> "$site/schemas/index.html" <<'HTML'
              </ul>
            </main>
          </body>
          </html>
          HTML

          write_redirect() {
            local directory="$1"
            local target="$2"
            local label="$3"
            mkdir -p -- "$directory"
            cat > "$directory/index.html" <<HTML
          <!doctype html>
          <html lang="en-US">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=${target}">
            <title>${label} | SPPT/ASTRA</title>
          </head>
          <body>
            <main><h1>${label}</h1><p><a href="${target}">Continue to the current versioned edition</a>.</p></main>
          </body>
          </html>
          HTML
          }

          write_redirect "$site/latest" "../${current_tag}/" "Current SPPT/ASTRA edition"
          write_redirect "$site/latest/preprint" "../../${current_tag}/preprint/" "Current SPPT/ASTRA preprint"
          write_redirect "$site/latest/supplement" "../../${current_tag}/supplement/" "Current SPPT/ASTRA technical supplement"
          write_redirect "$site/resources/earth-is-the-instrument" "./${framework_version}/" "Current Earth Is the Instrument framework"
          write_redirect "$site/resources/earth-is-the-instrument/latest" "../${framework_version}/" "Current Earth Is the Instrument framework"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/astra-pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
