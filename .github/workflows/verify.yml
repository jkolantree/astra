name: Verify

on:
  push:
    branches: [main]
    tags: ["v*", "dark-medium-response-atlas-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Historical Windows release contract
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OPENBLAS_CORETYPE: HASWELL
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install and verify exact Git for Windows
        shell: pwsh
        run: |
          $runtime = Get-Content -Raw RUNTIME.json | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'MinGit-2.55.0.3-64-bit.zip'
          $archiveSource = 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/MinGit-2.55.0.3-64-bit.zip'
          $archiveSha256 = 'f48e2d2dc74a24454adc6d8fd0ac25bf9c2386f19cfb06202b9465aaad4f9f05'
          Invoke-WebRequest -Uri $archiveSource -OutFile $archive
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($digest -ne $archiveSha256) {
            throw "Git bootstrap archive digest mismatch: $digest"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP 'astra-git'
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $gitPath = Join-Path $installRoot 'cmd'
          $gitExe = Join-Path $gitPath 'git.exe'
          $gitDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $gitExe).Hash.ToLowerInvariant()
          if ($gitDigest -ne $runtime.git.executable_sha256) {
            throw "Git executable digest mismatch: $gitDigest"
          }
          $gitPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Restore authoritative annotated release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -I -B tools/release_integrity.py restore-tag-ref

      - name: Install hash-locked dependencies
        run: python -I -B -m pip install --require-hashes -r requirements-lock.txt

      - name: Verify annotated release-tag identity
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -I -B tools/release_integrity.py verify-tag

      - name: Install the Playwright-pinned Chromium build
        run: python -I -B -m playwright install chromium

      - name: Run canonical complete verification
        run: python -I -B tools/verify.py --all --workers 4

      - name: Verify git-archive inventory and bytes
        if: github.ref_type != 'tag' || startsWith(github.ref, 'refs/tags/v')
        run: python -I -B tools/release_integrity.py verify-git-archive

      - name: Reject an unexplained worktree
        shell: pwsh
        run: |
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) {
            throw "Verification changed the tracked or admitted worktree:`n$status"
          }

  linux:
    name: Linux development and isolated replay
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    timeout-minutes: 90
    steps:
      - name: Install declared host prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv dpkg fonts-liberation \
            libicu76 libssl3t64 libgssapi-krb5-2 libstdc++6 zlib1g \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bootstrap pinned Linux tools
        run: python3 -I -B tools/bootstrap_linux.py
      - name: Verify Linux development and isolated replay
        run: .venv/bin/python -I -B tools/verify_linux_baseline.py --all --workers 4
      - name: Reject source or historical artifact mutation
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
