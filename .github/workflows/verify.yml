name: Verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Install the Playwright-pinned Chromium build
        run: python -m playwright install chromium

      - name: Run canonical complete verification
        run: python tools/verify.py --all --workers 4

      - name: Verify git-archive inventory and bytes
        run: python tools/release_integrity.py verify-git-archive

      - name: Reject an unexplained worktree
        shell: pwsh
        run: |
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) {
            throw "Verification changed the tracked or admitted worktree:`n$status"
          }
