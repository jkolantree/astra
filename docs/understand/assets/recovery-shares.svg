<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
  <title id="title">Recovery in the independently chosen two-out-of-three quantum code</title>
  <desc id="desc">The logical qutrit is encoded jointly across shares A, B and C, not copied into each share. Any two shares allow coherent recovery of the current logical state, including entanglement with an untouched reference. At a given time any single share contains no logical-state information. This code-access rule is separate from reconstruction using a time record and does not derive physical spacetime.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#182a35"/><stop offset="1" stop-color="#080e16"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#b6e6cb" stroke-width="1.5"/></marker>
  </defs>
  <rect width="600" height="720" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui, sans-serif" fill="#f6ecd5">
    <g text-anchor="middle">
      <text x="300" y="46" fill="#eec78b" font-size="20" letter-spacing="2">A SPECIFIED QUANTUM CODE</text>
      <text x="300" y="94" font-family="Georgia, serif" font-size="32">Recovery needs access</text>
      <text x="300" y="145" font-size="26">One state across three shares</text>
      <g fill="#203640" stroke="#b6e6cb" stroke-width="2"><circle cx="120" cy="213" r="38"/><circle cx="300" cy="213" r="38"/><circle cx="480" cy="213" r="38"/></g>
      <g font-size="30"><text x="120" y="224">A</text><text x="300" y="224">B</text><text x="480" y="224">C</text></g><path d="M158 213H262M338 213H442" stroke="#5c7d83" stroke-width="2"/>
      <text x="300" y="291" font-size="24" fill="#c0c6ca">Shares, not separate copies</text>
      <rect x="24" y="322" width="552" height="152" rx="18" fill="#1b3336" stroke="#5c7d83"/>
      <text x="300" y="362" font-size="28" fill="#b6e6cb">Any two: AB · AC · BC</text>
      <text x="300" y="405" font-size="26">Recover current logical state</text>
      <text x="300" y="442" font-size="24" fill="#c0c6ca">Keep reference entanglement</text>
      <rect x="24" y="495" width="552" height="111" rx="18" fill="#14202a" stroke="#5c7d83"/>
      <text x="300" y="533" font-size="28">One share alone</text>
      <text x="300" y="567" font-size="24" fill="#c0c6ca">No logical-state information</text>
      <text x="300" y="597" font-size="24" fill="#c0c6ca">at a given time</text>
      <text x="300" y="656" font-size="24" fill="#eec78b">Temporal readout is separate.</text>
      <text x="300" y="697" font-size="24" fill="#c0c6ca">This does not derive spacetime.</text>
    </g>
  </g>
</svg>