[project]
name = "sppt-astra"
version = "1.0.7"
description = "Reference implementation for Solar-Planetary Phase-Partition Theory and its ASTRA inference layer"
requires-python = "==3.12.10"
license = { text = "MIT" }
authors = [{ name = "Jacko T." }]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "tmp", "dist"]
cache-dir = "tmp/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# Preserve the reviewed supplier generator byte-for-byte. The repository checker
# pins its full SHA-256; these existing style/idiom findings apply only here.
[tool.ruff.lint.per-file-ignores]
"resources/sppt-scm-research-companion/draft-v0.1.0/package/visuals/scientific/generate_scientific_atlas.py" = ["B905", "E401", "E701", "E702", "E703", "E731", "E741", "F401", "I001"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
cache_dir = "tmp/mypy"
